[project]
name = "llc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cma>=4.6.0",
    "imageio>=2.38.1",
    "imageio-ffmpeg>=0.8.1",
    "markdown>=3.11.3",
    "matplotlib>=3.11.2",
    "mujoco>=4.0.1",
    "numpy>=2.5.4",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
    "torch>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["llc"]
